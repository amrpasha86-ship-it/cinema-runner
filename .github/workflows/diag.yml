name: Diag
on:
  workflow_dispatch:
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Posters
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VOX_REPO: ${{ secrets.VOX_REPO }}
          TZ: Africa/Cairo
        run: |
          git clone -q --depth 1 "https://x-access-token:${GH_PAT}@github.com/${VOX_REPO}.git" vox >/dev/null 2>&1
          pip install -q requests beautifulsoup4 python-dotenv >/dev/null 2>&1
          cd vox
          python - <<'PY2' 2>&1 | tail -20
          import vox_rotating_core as vox, vox_rotating_github as g
          page = vox.get_page(g.BASE_URL)
          for d, u in g.get_dates(page)[:13]:
              g.scan_date(d, u)
          for k, v in vox.POSTERS.items():
              print("POSTER|" + k + "|" + v)
          PY2
