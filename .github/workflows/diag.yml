name: Diag
on:
  workflow_dispatch:
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Posters
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RNS_REPO: ${{ secrets.RNS_REPO }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${GH_PAT}@github.com/${RNS_REPO}.git" rns >/dev/null 2>&1
          pip install -q requests beautifulsoup4 python-dotenv >/dev/null 2>&1
          cd rns
          python - <<'PY2' 2>&1 | tail -20
          import monitor
          monitor.get_shows()
          for k, v in monitor.POSTERS.items():
              print("RPOSTER|" + str(k) + "|" + str(v))
          PY2
