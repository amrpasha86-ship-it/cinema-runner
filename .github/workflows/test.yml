name: Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send marked test card
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VOX_REPO: ${{ secrets.VOX_REPO }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${GH_PAT}@github.com/${VOX_REPO}.git" vox >/dev/null 2>&1; echo "fetch $?"
          pip install -q requests beautifulsoup4 python-dotenv >/dev/null 2>&1
          cd vox
          python - <<'PY' 2>&1 | sed -E 's#https?://[^ ]+#<url>#g' | tail -8
          import os, re, requests
          import telegram_cards as tc
          import vox_rotating_core as vox
          try:
              page = vox.get_page("https://egy.voxcinemas.com/movies/dune-part-three")
              print("vox get_page ok")
              el = page.select_one('meta[property="og:image"]')
              poster = tc.resolve_poster(el["content"]) if el else None
          except Exception as e:
              print("vox fetch error", type(e).__name__)
              poster = None
          print("poster resolved", bool(poster))
          try:
              tc.send_card(os.environ["BOT_TOKEN"], os.environ["CHAT_ID"],
                       "<b>TEST CARD - NOT A REAL ALERT</b>",
                       ["Replacement runner send path check (VOX poster path).", "No action needed. Ignore this message."],
                       photo=poster)
              print("send_card returned")
          except Exception as e:
              print("send error", type(e).__name__)
          PY
