name: Run

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cinema-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VOX_REPO: ${{ secrets.VOX_REPO }}
          RNS_REPO: ${{ secrets.RNS_REPO }}
        run: |
          set +x
          git clone -q --depth 1 "https://x-access-token:${GH_PAT}@github.com/${VOX_REPO}.git" vox >/dev/null 2>&1; echo "fetch1 $?"
          git clone -q --depth 1 "https://x-access-token:${GH_PAT}@github.com/${RNS_REPO}.git" rns >/dev/null 2>&1; echo "fetch2 $?"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -q requests beautifulsoup4 python-dotenv >/dev/null 2>&1; echo "install $?"
      - name: VOX
        env:
          TZ: Africa/Cairo
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          cd vox
          python vox_rotating_github.py > /dev/null 2>&1; echo "vox exit $?"
      - name: Renaissance
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          cd rns
          printf 'BOT_TOKEN=%s\nCHAT_ID=%s\n' "$BOT_TOKEN" "$CHAT_ID" > .env
          python monitor.py --once > /dev/null 2>&1; echo "rns exit $?"
          python upcoming_monitor.py --once > /dev/null 2>&1; echo "upcoming exit $?"
          rm -f .env
      - name: Save state
        if: always()
        run: |
          rc=0
          save() {
            cd "$1"
            git config user.name "monitor"
            git config user.email "monitor@users.noreply.github.com"
            git add -f $2 >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              git commit -q -m "Update monitor state" >/dev/null 2>&1
              n=0; done_=1
              while [ $n -lt 4 ]; do
                n=$((n+1))
                git pull -q --rebase -X theirs origin main >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1 || true
                if git push -q >/dev/null 2>&1; then done_=0; break; fi
                sleep $((n*3))
              done
              if [ $done_ -eq 0 ]; then echo "$1 state saved (attempt $n)"; else echo "$1 PUSH FAILED after 4 attempts"; rc=1; fi
            fi
            cd ..
          }
          save vox vox_rotating_state.json
          save rns "renaissance_state.json upcoming_state.json"
          exit $rc
