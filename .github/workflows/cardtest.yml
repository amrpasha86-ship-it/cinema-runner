name: CardTest
on:
  workflow_dispatch:
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - name: Prepare
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VOX_REPO: ${{ secrets.VOX_REPO }}
          RNS_REPO: ${{ secrets.RNS_REPO }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${GH_PAT}@github.com/${VOX_REPO}.git" vox >/dev/null 2>&1; echo "f1 $?"
          git clone -q --depth 1 "https://x-access-token:${GH_PAT}@github.com/${RNS_REPO}.git" rns >/dev/null 2>&1; echo "f2 $?"
          pip install -q requests beautifulsoup4 python-dotenv >/dev/null 2>&1; echo "pip $?"
          mkdir -p /tmp/out
      - name: Poster diag
        env:
          CARDIMAGE_DIR: ${{ github.workspace }}/ci/cardimage
        run: |
          cd vox
          python - <<'PY2' 2>&1 | tail -12
          import requests
          import telegram_cards as tg
          import vox_rotating_core as vox
          import vox_rotating_github as g
          page = vox.get_page(g.BASE_URL)
          dates = g.get_dates(page)
          for d, u in dates[:3]:
              g.scan_date(d, u)
          print("posters", len(vox.POSTERS))
          for k, v in list(vox.POSTERS.items())[:4]:
              try:
                  r = requests.get(v, headers=tg.UA, timeout=15)
                  print(k[:20], v[:90], r.status_code, r.headers.get("content-type"), len(r.content))
              except Exception as e:
                  print(k[:20], v[:90], "ERR", type(e).__name__)
          PY2
